<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COPD Locus Review Browser</title>

<style>
:root {
    --sidebar-width: 280px;
    --primary: #1e293b;
    --accent: #2563eb;
    --bg: #f8fafc;
    --text: #334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    display:flex;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
}

#sidebar{
    width:var(--sidebar-width);
    background:var(--primary);
    color:white;
    display:flex;
    flex-direction:column;
    overflow-y:auto;        /* FIX #6: sidebar scrolls if many loci are added */
}

.sidebar-header{
    padding:20px;
    text-align:center;
    font-size:1.2rem;
    font-weight:700;
    border-bottom:1px solid #334155;
    flex-shrink:0;          /* keeps header pinned while nav scrolls */
}

.sidebar-section{
    padding:15px 0;
}

.sidebar-title{
    padding:8px 20px;
    font-size:.8rem;
    color:#94a3b8;
    text-transform:uppercase;
    letter-spacing:.1em;
}

.nav-link{
    display:block;
    padding:12px 24px;
    color:#cbd5e1;
    text-decoration:none;
    cursor:pointer;
    transition:.2s;
}

.nav-link:hover,
.nav-link.active{
    background:var(--accent);
    color:white;
}

#main-content{
    flex:1;
    overflow-y:auto;
    padding:40px;
}

.content-card{
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:20px;
    color:var(--primary);
}

h2{
    margin-top:30px;
    margin-bottom:15px;
    color:var(--primary);
}

/* FIX #4: h3 style for info-cards */
h3{
    margin-bottom:8px;
    color:var(--primary);
    font-size:1rem;
}

p{
    line-height:1.7;
    margin-bottom:12px;
}

ul, ol{         /* FIX #3: ol now gets same indent treatment as ul */
    margin-left:20px;
}

li{
    margin-bottom:8px;
}

.workflow-image{
    width:100%;
    max-width:1000px;
    display:block;
    margin:25px auto;
    border-radius:8px;
    border:1px solid #dbeafe;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.info-card{
    background:#f8fafc;
    padding:20px;
    border-radius:8px;
    border-left:4px solid var(--accent);
}

.download-link{
    display:inline-block;
    margin:5px 0;
    color:#2563eb;
    text-decoration:none;
}

.download-link:hover{
    text-decoration:underline;
}

.plot-image{
    width:100%;
    border:1px solid #e2e8f0;
    border-radius:8px;
    margin-top:20px;
}
</style>
</head>

<body>

<div id="sidebar">

    <div class="sidebar-header">
        🧬 Agentic Gene Prioritization Dashboard
    </div>

    <div class="sidebar-section">
        <div class="sidebar-title">Overview</div>

        <!-- FIX #1 & #2: use href="#" and pass 'this' instead of 'event' -->
        <a class="nav-link active"
           href="#home"
           onclick="loadPage('home', this)">
           Home
        </a>

        <a class="nav-link"
           href="#methods"
           onclick="loadPage('methods', this)">
           Methods
        </a>

        <a class="nav-link"
           href="#repository"
           onclick="loadPage('repository', this)">
           Repository Contents
        </a>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-title">Chromosomes</div>

        <a class="nav-link"
           href="#CHR1"
           onclick="loadPage('CHR1', this)">
           CHR1
        </a>

        <a class="nav-link"
           href="#CHR2"
           onclick="loadPage('CHR2', this)">
           CHR2
        </a>

        <a class="nav-link"
           href="#CHR3"
           onclick="loadPage('CHR3', this)">
           CHR3
        </a>

    </div>

</div>

<div id="main-content">

    <div id="display-area" class="content-card">
        Loading...
    </div>

</div>

<script>

const pages = {

home: `
<h1>COPD GWAS Locus Prioritization Browser</h1>

<p>
This website hosts the outputs generated from the agentic COPD locus
review workflow. Each locus undergoes literature review, citation
verification, adversarial review, and final evidence synthesis.
</p>

<img class="workflow-image"
     src="assets/agentic-gene-prioritization.png"
     alt="Agentic Review Workflow">

<h2>Workflow Overview</h2>

<p>
Candidate genes are collected from locus definitions and prioritization
methods. Literature evidence is gathered, verified, stress-tested, and
combined with Open Targets evidence before creating final rankings.
</p>

<div class="info-grid">

    <div class="info-card">
        <h3>Researcher</h3>
        <p>Searches PubMed, bioRxiv, medRxiv, and web resources.</p>
    </div>

    <div class="info-card">
        <h3>Citation Verifier</h3>
        <p>Confirms publication existence and validates claims.</p>
    </div>

    <div class="info-card">
        <h3>Red-Team Skeptic</h3>
        <p>Evaluates contradictory findings and possible biases.</p>
    </div>

    <div class="info-card">
        <h3>Synthesis Lead</h3>
        <p>Produces final evidence tables and gene prioritization.</p>
    </div>

</div>

<h2>Available Outputs</h2>

<ul>
<li>Evidence Tables</li>
<li>Audit Reports</li>
<li>Locus Definitions</li>
<li>Locus Plots</li>
<li>Pipeline Logs</li>
<li>Methods Documentation</li>
</ul>
`,

methods: `
<h1>Methods</h1>

<p>
A multi-agent literature review framework was used to prioritize
candidate genes at COPD GWAS loci.
</p>

<h2>Review Stages</h2>

<ol>
<li>Literature collection</li>
<li>Citation verification</li>
<li>Red-team challenge process</li>
<li>Final synthesis and prioritization</li>
</ol>

<h2>Data Sources</h2>

<ul>
<li>PubMed</li>
<li>bioRxiv</li>
<li>medRxiv</li>
<li>Open Targets</li>
</ul>

<p>
All accepted citations undergo verification prior to inclusion
in evidence tables.
</p>

<p>
See README_METHODS.md for complete methodological details.
</p>
`,

repository: `
<h1>Repository Structure</h1>

<h2>copd-locus-review</h2>

<ul>
<li><strong>loci/</strong> – locus definitions</li>
<li><strong>evidence_tables/</strong> – final evidence summaries</li>
<li><strong>audits/</strong> – rejected and contested citations</li>
<li><strong>logs/</strong> – pipeline provenance</li>
<li><strong>scripts/</strong> – review utilities</li>
<li><strong>README.md</strong> – project documentation</li>
<li><strong>README_METHODS.md</strong> – manuscript methods</li>
</ul>

<h2>locus-plots</h2>

<p>
Regional association plots and locus visualizations used during review.
</p>

<h2>Downloads</h2>

<p>Replace these links with your actual files.</p>

<a class="download-link" href="data/README.md">README.md</a><br>
<a class="download-link" href="data/README_METHODS.md">README_METHODS.md</a>
`,

locusA: `
<h1>Locus A</h1>

<p>Lead Variant: rsXXXXXX</p>

<p>Prioritized Gene: GENE1</p>

<!-- FIX #5: added descriptive alt attribute -->
<img class="plot-image"
     src="plots/locusA.png"
     alt="Regional association plot for Locus A">

<h2>Files</h2>

<a class="download-link" href="data/evidence_tables/locusA.md">
Evidence Table
</a><br>

<a class="download-link" href="data/audits/locusA_audit.md">
Audit Report
</a>
`,

locusB: `
<h1>Locus B</h1>
<p>Placeholder for locus review results.</p>
`,

locusC: `
<h1>Locus C</h1>
<p>Placeholder for locus review results.</p>
`

};

/* FIX #1: parameter is now 'el' (the clicked <a> element via 'this'),
   no longer relying on event.target */
function loadPage(pageKey, el) {
    document.querySelectorAll('.nav-link')
        .forEach(link => link.classList.remove('active'));

    el.classList.add('active');

    document.getElementById('display-area').innerHTML =
        pages[pageKey] || "<h1>Error</h1><p>Page not found.</p>";
}

// Render home page on initial load
document.getElementById('display-area').innerHTML = pages.home;

</script>

</body>
</html>
