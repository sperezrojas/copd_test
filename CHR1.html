function buildDropdown() {
  const sel = document.getElementById('locus-select');
  CHR1_LOCI.forEach(l => {
    const opt = document.createElement('option');
    opt.value       = l.index;
    opt.textContent = l.label;
    sel.appendChild(opt);
  });
}

function switchLocus(index) {
  currentLocusIndex = index;
  const locus = CHR1_LOCI[index];

  /* sync dropdown */
  document.getElementById('locus-select').value = index;

  /* update prev/next button states */
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === CHR1_LOCI.length - 1);

  /* update plot */
  const img         = document.getElementById('locus-plot-img');
  const placeholder = document.getElementById('plot-placeholder');
  const plotErr     = document.getElementById('plot-error');
  placeholder.style.display = 'none';
  plotErr.style.display     = 'none';
  img.style.display         = 'block';
  img.src                   = locus.plot;
  img.alt                   = `Regional association plot — ${locus.label}`;
  document.getElementById('plot-error-path').textContent = locus.plot;

  /* update files links */
  const filesCard = document.getElementById('files-card');
  if (locus.evidenceHref !== '#' || locus.auditHref !== '#') {
    filesCard.style.display = '';
    document.getElementById('btn-evidence').href = locus.evidenceHref;
    document.getElementById('btn-audit').href    = locus.auditHref;
  } else {
    filesCard.style.display = '';          /* still show card */
    document.getElementById('btn-evidence').href = '#';
    document.getElementById('btn-audit').href    = '#';
  }

  /* reset filter/sort state then render evidence */
  evSortCol = -1; evSortAsc = true;
  renderLocusData(locus.id);
}

function prevLocus() {
  if (currentLocusIndex > 0) switchLocus(currentLocusIndex - 1);
}
function nextLocus() {
  if (currentLocusIndex < CHR1_LOCI.length - 1) switchLocus(currentLocusIndex + 1);
}

function handlePlotError(img) {
  img.style.display = 'none';
  document.getElementById('plot-error').style.display = 'block';
}

  section.innerHTML =

/* ── Open Targets card ──────────────────────────────────────────────── */
function buildOTCard(locusId) {
  const rows   = OT_DATA[locusId] || [];
  const footer = OT_FOOTER[locusId] || '';

  const rowsHtml = rows.map(r => {
    const scoreCell = r.copdScore !== null
      ? `<span class="ev-ot-present">Score ${r.copdScore} &nbsp;|&nbsp; GA ${r.copd_ga}</span>`
      : `<span class="ev-ot-absent">Not present / COPD absent</span>`;

    const cMap = {'0':'c0','1':'c1','2':'c2','3':'c3','4':'c4','5':'c5','NC':'cnc'};
    const cCls  = cMap[r.constraint] || 'cnc';
    const cDesc = {'0':'most constrained','5':'most tolerant','NC':''}[r.constraint] || 'intermediate';
    const cCell = r.constraint === 'NC'
      ? '<span class="ev-constraint cnc">No data (non-coding)</span>'
      : `<span class="ev-constraint ${cCls}">${esc(r.constraint)}</span>
         <span class="ev-constraint-desc">(${cDesc})</span>`;

    return `
      <tr>
        <td><span class="ev-gene-name">${esc(r.gene)}</span></td>
        <td>${scoreCell}</td>
        <td class="ev-coloc-cell">${esc(r.coloc)}</td>
        <td>${cCell}</td>
        <td class="ev-ot-notes">${esc(r.notes)}</td>
      </tr>`;
  }).join('');

  return `
  <div class="content-card ev-ot-card">
    <h3 class="ev-section-title">Open Targets Summary</h3>
    <div class="ev-notice ev-notice--ot">
      ⚠ <strong>Structured database lookup only.</strong>
      This section is NOT a verified literature citation and did not go through
      the citation-verifier or red-team-skeptic pipeline steps.
    </div>
    <div class="ev-table-scroll">
      <table class="ev-table ev-ot-table">
        <thead>
          <tr>
            <th>Gene</th>
            <th>L2G / COPD score (MONDO_0005002)</th>
            <th>Colocalization</th>
            <th>Constraint (gnomAD LOF upperBin6)</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <p class="ev-ot-footer-note">${esc(footer)}</p>
  </div>`;
}


/* ── Synthesis card ─────────────────────────────────────────────────── */
function buildSynthesisCard(locusId) {
  const s = SYNTHESIS[locusId];
  if (!s) return '';

  const roleClass = { primary:'ev-gene-primary', 'runner-up':'ev-gene-runner',
                      'second-runner':'ev-gene-second' };

  const candidatesHtml = s.candidates.map(c => `
    <div class="ev-candidate-block ${roleClass[c.role] || ''}">
      <div class="ev-candidate-header">
        <span class="ev-gene-pill ev-gene-pill--highlight">${esc(c.gene)}</span>
        <span class="ev-candidate-label">${esc(c.label)}</span>
      </div>
      <p class="ev-candidate-desc">${c.desc}</p>
    </div>`).join('');

  const resolversHtml = s.resolvers
    .map((r,i) => `<li>${esc(r)}</li>`).join('');

  return `
  <div class="content-card ev-synthesis-card">
    <h3 class="ev-section-title">Prioritized-Gene Synthesis</h3>

    <div class="ev-synthesis-verdict">
      <strong>Prioritized gene: ${esc(s.topGene)}</strong>
      <span class="ev-synthesis-sep">—</span>
      <span>Confidence: <strong>${esc(s.confidence)}</strong></span>
    </div>

    <p class="ev-synthesis-summary">${esc(s.summary)}</p>

    <div class="ev-candidates-list">${candidatesHtml}</div>

    <div class="ev-resolve-box">
      <h4 class="ev-resolve-title">🔍 What would resolve the tie</h4>
      <ol class="ev-resolve-list">${resolversHtml}</ol>
    </div>

    <div class="ev-caveat-box">
      <strong>Note:</strong> ${s.caveat}
    </div>
  </div>`;
}

function buildGeneFilter(locusId) {
  const rows = EVIDENCE_ROWS[locusId] || [];
  const genes = [...new Set(rows.map(r => r.gene))];
  const sel = document.getElementById('ev-filter-gene');
  if (!sel) return;
  sel.innerHTML = '<option value="">All genes</option>';
  genes.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    sel.appendChild(opt);
  });
}

function renderEvidenceRows(locusId) {
  const tbody   = document.getElementById('ev-tbody');
  const countEl = document.getElementById('ev-row-count');
  const allRows = EVIDENCE_ROWS[locusId] || [];
  const noLitEl = document.getElementById('ev-no-lit-box');
  const meta    = LOCUS_META[locusId];

  if (noLitEl && meta && meta.noLitGenes) {
    noLitEl.innerHTML =
      `<strong>Genes with no citable literature (VERIFIED or otherwise):</strong> ${esc(meta.noLitGenes)}`;
  }

  if (!tbody) return;
  tbody.innerHTML = '';

  if (!evFiltered.length) {
    tbody.innerHTML =
      '<tr><td colspan="6" class="ev-no-results">No rows match the current filters.</td></tr>';
    if (countEl) countEl.textContent = '0 rows';
    return;
  }

  evFiltered.forEach((r, idx) => {
    const vg   = verdictGroup(r.verdict);
    const vcls = verdictClass(r.verdict);
    const cid  = `ev-claim-${idx}`;

    const pmidLink = r.pmid
      ? `<a class="ev-cit-link ev-pmid"
            href="https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/"
            target="_blank" rel="noopener">PMID ${esc(r.pmid)}</a>`
      : '';
    const doiLink = r.doi
      ? `<a class="ev-cit-link ev-doi"
            href="https://doi.org/${r.doi}"
            target="_blank" rel="noopener">DOI</a>`
      : '';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="ev-gene-name">${esc(r.gene)}</div>
        ${r.geneNote ? `<div class="ev-gene-note">${esc(r.geneNote)}</div>` : ''}
      </td>
      <td class="ev-type-cell">${esc(r.type)}</td>
      <td>
        <div class="ev-claim-text" id="${cid}">${esc(r.claim)}</div>
        <button class="ev-expand-btn" onclick="toggleClaim('${cid}',this)">▼ Show more</button>
      </td>
      <td>
        <div class="ev-cit-text">${esc(r.citation)}</div>
        <div class="ev-cit-links">${pmidLink}${doiLink}</div>
      </td>
      <td>
        <span class="ev-verdict ${vcls}">${vg}</span>
        ${r.verdiQual
          ? `<div class="ev-verdict-qual">${esc(r.verdiQual)}</div>`
          : ''}
      </td>
      <td class="ev-date-cell">${esc(r.date)}</td>`;
    tbody.appendChild(tr);
  });

  if (countEl)
    countEl.textContent = `${evFiltered.length} of ${allRows.length} rows`;
}

function toggleClaim(id, btn) {
  const el = document.getElementById(id);
  const expanded = el.classList.toggle('ev-claim-expanded');
  btn.textContent = expanded ? '▲ Show less' : '▼ Show more';
}

function applyEvFilters(locusId) {
  const gene    = (document.getElementById('ev-filter-gene')?.value    || '');
  const verdict = (document.getElementById('ev-filter-verdict')?.value || '');
  const search  = (document.getElementById('ev-filter-search')?.value  || '').toLowerCase();
  const allRows = EVIDENCE_ROWS[locusId] || [];

  evFiltered = allRows.filter(r => {
    if (gene    && r.gene !== gene)                      return false;
    if (verdict && verdictGroup(r.verdict) !== verdict)  return false;
    if (search) {
      const hay = (r.gene+' '+r.claim+' '+r.citation+' '+r.type+' '+r.pmid).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  if (evSortCol >= 0) doEvSort();
  renderEvidenceRows(locusId);
  updateSortHeaders();
}

function resetEvFilters(locusId) {
  const gs = document.getElementById('ev-filter-gene');
  const vs = document.getElementById('ev-filter-verdict');
  const ss = document.getElementById('ev-filter-search');
  if (gs) gs.value = '';
  if (vs) vs.value = '';
  if (ss) ss.value = '';
  evSortCol = -1; evSortAsc = true;
  evFiltered = [...(EVIDENCE_ROWS[locusId] || [])];
  updateSortHeaders();
  renderEvidenceRows(locusId);
}

const EV_SORT_KEYS = ['gene','type','claim','citation','verdict','date'];
function sortEv(col, locusId) {
  if (evSortCol === col) { evSortAsc = !evSortAsc; }
  else { evSortCol = col; evSortAsc = true; }
  doEvSort();
  updateSortHeaders();
  renderEvidenceRows(locusId);
}
function doEvSort() {
  const key = EV_SORT_KEYS[evSortCol];
  evFiltered.sort((a, b) => {
    const av = (a[key] || '').toLowerCase();
    const bv = (b[key] || '').toLowerCase();
    return evSortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
}
function updateSortHeaders() {
  document.querySelectorAll('#ev-table thead th').forEach((th, i) => {
    th.classList.remove('ev-sorted-asc','ev-sorted-desc');
    if (i === evSortCol)
      th.classList.add(evSortAsc ? 'ev-sorted-asc' : 'ev-sorted-desc');
  });
}


/* ════════════════════════════════════════════════════════════════════════
   ⑩  UTILITIES
   ════════════════════════════════════════════════════════════════════════ */
function verdictGroup(v) {
  if (!v) return 'N/A';
  if (v.startsWith('WEAKENED'))  return 'WEAKENED';
  if (v.startsWith('CONTESTED')) return 'CONTESTED';
  if (v.startsWith('HOLDS'))     return 'HOLDS';
  return 'N/A';
}
function verdictClass(v) {
  return { WEAKENED:'ev-v-weakened', CONTESTED:'ev-v-contested',
           HOLDS:'ev-v-holds', 'N/A':'ev-v-na' }[verdictGroup(v)] || 'ev-v-na';
}
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


/* ════════════════════════════════════════════════════════════════════════
   ⑪  BOOT
   ════════════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildDropdown();
  switchLocus(0);   /* load first locus automatically */
});

</script>
</body>
</html>
